# A runbook for pulling a source system's data into this hub.
extends: [gtm.entity]
fields:
  sourceSystem: String
  accessPath: [mcp, api, browser, cli, export]
  requiresAuth: [yes, no]
  authOwner: String
  method: String            #: e.g. "codemode + mcp access"
  coordinatorRoute: String
  workerRoute: String
  outputs: String[]
  idempotency: String       #: how to know it already ran, so we never duplicate
  evidence: gtm.evidence[]
body:
  - section: Preconditions
  - section: Procedure
  - section: Proof of delivery
    guidance: "What artifact rows, file counts, or hashes prove this actually landed. 'completed' status is never proof."
  - section: Do not repeat if
