# A class of buying trigger, not an observed instance.
extends: [gtm.entity]
fields:
  rank: Number{integer}     #: 1 = strongest intent
  sourceSystems: String[]   #: where it can be observed
  query: String             #: the concrete filter/search that finds it
  citationRequirement: String
  decayDays: Number{integer}
  falsePositives: String[]
  openerAngle: String       #: how it becomes a first line
  evidence: gtm.evidence[]
body:
  - section: How to detect
  - section: How to disqualify
