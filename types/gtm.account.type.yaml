# An Opulent production account this hub pilots.
extends: [gtm.entity]
fields:
  email: String
  opulentUserId: String
  plan: [Free, Pro, Heavy]
  deployment: String       #: e.g. prod:confident-sheep-333
  balanceCents: Number{>=0}
  workspaceId: String
  isolated: [yes, no]      #: yes = no general Opulent workspace membership
  evidence: gtm.evidence[]
