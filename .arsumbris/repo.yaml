# Folder-repo identity. Without this the daemon hard-refuses the entry (entry-not-a-repo).
type: au.engine.repo::au-engine
name: merraine-context-hub
remote: git@github.com:OpulentiaAI/merraine-context-hub.git
description: >
  Typed GTM context hub for Merraine Group, piloted by Opulent. Extends the base
  ontology with a go-to-market vocabulary (signals, observations, sequences,
  automations, extractions) plus the runbooks, research and agent surface for
  Jeremy Sanchez's Opulent account.
deps:
  - name: au-base-types
  - name: au-mcp-sdk
  - name: au-skills
  - name: au-writing-style
  # Host-side packages referenced by workspace-layout.yaml. Declared directly so
  # the mount is self-describing instead of relying on discover: host-bundle.
  - name: au-host-sdk
  - name: aup-reader
  - name: aup-workspace-sidebar
  - name: bento
  - name: column
  - name: editor
  - name: file-tree
  - name: force-graph
  - name: intent
  - name: media-viewers
  - name: placeholder-picker
  - name: sandwich
  - name: tabs
